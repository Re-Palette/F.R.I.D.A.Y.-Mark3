# E.D.I.T.H. 情報収集の「実データ確認」（手動実行だけ。定期実行はしない）。
# USGS・NOAA NHC・気象庁の公式データを 1 回ずつ取り、EDITH の解析コードで読めるかを確かめて、結果をこのログに表示する。
#   - Vercel の本番は呼ばない。EDITH_INTEL は使わない。秘密の値（secrets）は一切使わない
#   - 脳（Obsidian 用リポジトリ）への書き込み・通知・ファイルの保存はしない（scripts/intel-check.ts）
#   - 実行方法：GitHub の Actions タブ → edith-intel-check → Run workflow
name: edith-intel-check

on:
  workflow_dispatch: {}

# 読み取りだけ（このリポジトリを取り出すため）
permissions:
  contents: read

# 同時に 2 つ動かさない（あとから押した分は、前の分が終わるまで待つ）
concurrency:
  group: edith-intel-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # 取り出したあと、GitHub の鍵を手元に残さない
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 依存パッケージは入れない（確認用スクリプトは Node.js の標準機能だけで動く）
      - name: Check real data (fetch and parse only)
        run: node --experimental-transform-types --no-warnings --import ./tests/register.mjs scripts/intel-check.ts
